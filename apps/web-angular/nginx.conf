log_format safe_json escape=json
  '{"remote":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time}';

map $http_x_forwarded_proto $public_scheme {
  default $scheme;
  https https;
}
map $http_x_forwarded_for $trusted_client_chain {
  default $http_x_forwarded_for;
  "" $remote_addr;
}
map $public_scheme $hsts_policy {
  default "";
  https "max-age=31536000; includeSubDomains";
}
map $uri $document_cache_control {
  default "";
  /index.html "no-store";
}

server_tokens off;
access_log /dev/stdout safe_json;
error_log /dev/stderr warn;

server {
  listen 8080 default_server;
  server_name "";
  return 404;
}

server {
  listen 8080;
  server_name ${PUBLIC_HOST};
  root /usr/share/nginx/html;
  client_max_body_size 100m;

  location /api/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $trusted_client_chain;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $public_scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /hubs/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $trusted_client_chain;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $public_scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /health {
    proxy_pass http://${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $trusted_client_chain;
    proxy_set_header X-Forwarded-Proto $public_scheme;
  }

  location / { try_files $uri $uri/ /index.html; }
  location = /index.html { }
  location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2)$ { expires 1y; }

  add_header Cache-Control $document_cache_control always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' wss://${PUBLIC_HOST}; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
  add_header Strict-Transport-Security $hsts_policy always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
}
