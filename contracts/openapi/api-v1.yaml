openapi: 3.0.3
info:
  title: Enterprise Social & Community Platform API
  version: v1
servers:
  - url: http://localhost:5000
paths:
  /api/v1/identity/register:
    post:
      operationId: register
      tags: [Identity]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses:
        '201': { description: Registered; public demo may also issue an HttpOnly synthetic-mailbox capability cookie, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/identity/login:
    post:
      operationId: login
      tags: [Identity]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Logged in, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/identity/browser/login:
    post:
      operationId: browserLogin
      tags: [Identity]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Browser session established; refresh secret is set only as an HttpOnly cookie, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserLoginResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/identity/refresh:
    post:
      operationId: refresh
      tags: [Identity]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses:
        '200': { description: Rotated, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/identity/logout:
    post:
      operationId: logout
      tags: [Identity]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses: { '204': { description: Logged out } }
  /api/v1/identity/browser/refresh:
    post:
      operationId: browserRefresh
      tags: [Identity]
      parameters:
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      responses:
        '200': { description: Browser access token rotated; refresh secret remains cookie-only, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserAccessToken' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/identity/browser/logout:
    post:
      operationId: browserLogout
      tags: [Identity]
      parameters:
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      responses:
        '204': { description: Browser session revoked and cookies cleared }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/system/public-demo:
    get:
      operationId: getPublicDemoStatus
      tags: [System]
      responses:
        '200': { description: Public demo capability status, content: { application/json: { schema: { $ref: '#/components/schemas/PublicDemoStatus' } } } }
  /api/v1/identity/demo-mailbox:
    post:
      operationId: readPublicDemoMailbox
      tags: [Identity]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses:
        '200': { description: Active synthetic demo actions owned by the current HttpOnly mailbox capability, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PublicDemoMailboxMessage' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/identity/email-verification/request:
    post:
      operationId: requestEmailVerification
      tags: [Identity]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses: { '202': { description: Request accepted regardless of account existence } }
  /api/v1/identity/email-verification/confirm:
    post:
      operationId: confirmEmailVerification
      tags: [Identity]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityTokenRequest' } } } }
      responses: { '204': { description: Email verified }, '400': { $ref: '#/components/responses/Problem' } }
  /api/v1/identity/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [Identity]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses: { '202': { description: Request accepted regardless of account existence } }
  /api/v1/identity/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [Identity]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } } }
      responses: { '204': { description: Password changed and sessions revoked }, '400': { $ref: '#/components/responses/Problem' } }
  /api/v1/identity/mfa/enrollment:
    post:
      operationId: beginMfaEnrollment
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Enrollment, content: { application/json: { schema: { $ref: '#/components/schemas/MfaEnrollment' } } } } }
  /api/v1/identity/mfa/confirmation:
    post:
      operationId: confirmMfaEnrollment
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmMfaRequest' } } } }
      responses: { '200': { description: Recovery codes, content: { application/json: { schema: { $ref: '#/components/schemas/MfaConfirmation' } } } } }
  /api/v1/identity/mfa/disable:
    post:
      operationId: disableMfa
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaCodeRequest' } } } }
      responses: { '204': { description: MFA disabled } }
  /api/v1/identity/sessions:
    get:
      operationId: listSessions
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Sessions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SessionView' } } } } }
  /api/v1/identity/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Revoked }, '404': { $ref: '#/components/responses/Problem' } }
  /api/v1/identity/privacy/export:
    get:
      operationId: exportMyIdentityData
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Identity-owned personal data export, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityDataExport' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/identity/privacy:
    delete:
      operationId: deleteMyIdentityData
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteMyDataRequest' } } } }
      responses:
        '204': { description: Direct identifiers anonymized and all sessions revoked }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/profiles/me:
    get:
      operationId: getMyProfile
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileView' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateMyProfile
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProfileRequest' } } } }
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileView' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/profiles/{handle}:
    get:
      operationId: getProfileByHandle
      tags: [Profiles]
      parameters: [{ name: handle, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileView' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/social-graph/{targetId}/follow:
    post:
      operationId: follow
      tags: [SocialGraph]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TargetId' }]
      responses:
        '200': { description: Relationship, content: { application/json: { schema: { $ref: '#/components/schemas/RelationshipView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: unfollow
      tags: [SocialGraph]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TargetId' }]
      responses: { '200': { description: Relationship, content: { application/json: { schema: { $ref: '#/components/schemas/RelationshipView' } } } } }
  /api/v1/social-graph/requests/{requesterId}/accept:
    post:
      operationId: acceptFollow
      tags: [SocialGraph]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: requesterId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Relationship, content: { application/json: { schema: { $ref: '#/components/schemas/RelationshipView' } } } } }
  /api/v1/social-graph/requests/{requesterId}:
    delete:
      operationId: rejectFollow
      tags: [SocialGraph]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: requesterId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Rejected relationship, content: { application/json: { schema: { $ref: '#/components/schemas/RelationshipView' } } } }, '404': { $ref: '#/components/responses/Problem' } }
  /api/v1/social-graph/requests/incoming:
    get:
      operationId: listIncomingFollowRequests
      tags: [SocialGraph]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: Incoming follow requests, content: { application/json: { schema: { $ref: '#/components/schemas/SocialGraphPage' } } } } }
  /api/v1/social-graph/{ownerId}/summary:
    get:
      operationId: getSocialGraphSummary
      tags: [SocialGraph]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Social graph summary, content: { application/json: { schema: { $ref: '#/components/schemas/SocialGraphSummaryView' } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /api/v1/social-graph/{ownerId}/profiles/{kind}:
    get:
      operationId: listSocialGraphProfiles
      tags: [SocialGraph]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [Followers, Following] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: Social graph profiles, content: { application/json: { schema: { $ref: '#/components/schemas/SocialGraphPage' } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /api/v1/social-graph/{targetId}:
    get:
      operationId: getRelationship
      tags: [SocialGraph]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TargetId' }]
      responses: { '200': { description: Relationship, content: { application/json: { schema: { $ref: '#/components/schemas/RelationshipView' } } } } }
  /api/v1/social-graph/{targetId}/block:
    put: { operationId: block, tags: [SocialGraph], security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/TargetId' }], responses: { '200': { description: Relationship, content: { application/json: { schema: { $ref: '#/components/schemas/RelationshipView' } } } } } }
    delete: { operationId: unblock, tags: [SocialGraph], security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/TargetId' }], responses: { '200': { description: Relationship, content: { application/json: { schema: { $ref: '#/components/schemas/RelationshipView' } } } } } }
  /api/v1/social-graph/{targetId}/mute:
    put: { operationId: mute, tags: [SocialGraph], security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/TargetId' }], responses: { '200': { description: Relationship, content: { application/json: { schema: { $ref: '#/components/schemas/RelationshipView' } } } } } }
    delete: { operationId: unmute, tags: [SocialGraph], security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/TargetId' }], responses: { '200': { description: Relationship, content: { application/json: { schema: { $ref: '#/components/schemas/RelationshipView' } } } } } }
  /api/v1/questions:
    post:
      operationId: askQuestion
      tags: [Questions]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AskQuestionRequest' } } } }
      responses: { '201': { description: Question created, content: { application/json: { schema: { $ref: '#/components/schemas/QuestionView' } } } }, '400': { $ref: '#/components/responses/Problem' } }
  /api/v1/questions/inbox:
    get:
      operationId: getQuestionInbox
      tags: [Questions]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [Draft, Scheduled, Published, Answered, Archived, Deleted] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses: { '200': { description: Question inbox, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/QuestionView' } } } } } }
  /api/v1/questions/by-profile/{targetId}:
    get:
      operationId: getProfileQuestions
      tags: [Questions]
      parameters:
        - { $ref: '#/components/parameters/TargetId' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 12, default: 6 } }
      responses:
        '200': { description: Viewer-safe answered profile questions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/QuestionView' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/questions/{id}/answer:
    post:
      operationId: answerQuestion
      tags: [Questions]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/QuestionId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnswerQuestionRequest' } } } }
      responses: { '200': { description: Question answered, content: { application/json: { schema: { $ref: '#/components/schemas/QuestionView' } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /api/v1/questions/{id}/archive:
    put:
      operationId: archiveQuestion
      tags: [Questions]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/QuestionId' }]
      responses: { '200': { description: Question archived, content: { application/json: { schema: { $ref: '#/components/schemas/QuestionView' } } } } }
  /api/v1/questions/{id}:
    get:
      operationId: getQuestion
      tags: [Questions]
      parameters: [{ $ref: '#/components/parameters/QuestionId' }]
      responses:
        '200': { description: Viewer-safe answered question, content: { application/json: { schema: { $ref: '#/components/schemas/QuestionView' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteQuestion
      tags: [Questions]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/QuestionId' }]
      responses: { '200': { description: Question tombstoned, content: { application/json: { schema: { $ref: '#/components/schemas/QuestionView' } } } } }
  /api/v1/content:
    post:
      operationId: createPost
      tags: [Content]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePostRequest' } } } }
      responses: { '201': { description: Post created, content: { application/json: { schema: { $ref: '#/components/schemas/PostView' } } } }, '400': { $ref: '#/components/responses/Problem' } }
  /api/v1/content/{contentId}:
    get:
      operationId: getContent
      tags: [Content]
      parameters: [{ $ref: '#/components/parameters/ContentId' }]
      responses: { '200': { description: Visible content, content: { application/json: { schema: { $ref: '#/components/schemas/ContentItem' } } } }, '404': { $ref: '#/components/responses/Problem' } }
    put:
      operationId: updatePost
      tags: [Content]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ContentId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePostRequest' } } } }
      responses: { '200': { description: Post updated, content: { application/json: { schema: { $ref: '#/components/schemas/PostView' } } } } }
    delete:
      operationId: deletePost
      tags: [Content]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ContentId' }]
      responses: { '200': { description: Post tombstoned, content: { application/json: { schema: { $ref: '#/components/schemas/PostView' } } } } }
  /api/v1/content/{contentId}/reaction:
    put:
      operationId: setReaction
      tags: [Reactions]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ContentId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetReactionRequest' } } } }
      responses: { '200': { description: Reaction set, content: { application/json: { schema: { $ref: '#/components/schemas/ReactionView' } } } } }
    delete:
      operationId: removeReaction
      tags: [Reactions]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ContentId' }]
      responses: { '200': { description: Reaction removed, content: { application/json: { schema: { $ref: '#/components/schemas/ReactionView' } } } } }
  /api/v1/content/{contentId}/poll:
    get:
      operationId: getPoll
      tags: [Content]
      parameters: [{ $ref: '#/components/parameters/ContentId' }]
      responses:
        '200': { description: Poll, content: { application/json: { schema: { $ref: '#/components/schemas/PollView' } } } }
        '204': { description: Visible content has no poll }
    post:
      operationId: createPoll
      tags: [Content]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ContentId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePollRequest' } } } }
      responses: { '201': { description: Poll created, content: { application/json: { schema: { $ref: '#/components/schemas/PollView' } } } } }
  /api/v1/content/{contentId}/poll/votes:
    post:
      operationId: votePoll
      tags: [Content]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ContentId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VotePollRequest' } } } }
      responses: { '200': { description: Vote accepted, content: { application/json: { schema: { $ref: '#/components/schemas/PollView' } } } } }
  /api/v1/content/{contentId}/saved:
    put:
      operationId: saveContent
      tags: [Content]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ContentId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveContentRequest' } } } }
      responses: { '204': { description: Saved idempotently } }
    delete:
      operationId: removeSavedContent
      tags: [Content]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ContentId' }, { name: collection, in: query, schema: { type: string, nullable: true } }]
      responses: { '204': { description: Removed idempotently } }
  /api/v1/content/saved:
    get:
      operationId: listSavedContent
      tags: [Content]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: collection, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }, { name: cursor, in: query, schema: { type: string } }]
      responses: { '200': { description: Saved content page, content: { application/json: { schema: { $ref: '#/components/schemas/SavedContentPage' } } } } }
  /api/v1/content/{contentId}/impressions:
    post:
      operationId: recordImpression
      tags: [Content]
      parameters: [{ $ref: '#/components/parameters/ContentId' }, { name: X-View-Session, in: header, required: false, schema: { type: string } }]
      responses: { '200': { description: Daily unique impression result, content: { application/json: { schema: { $ref: '#/components/schemas/ImpressionResult' } } } } }
  /api/v1/content/{contentId}/reactions:
    get:
      operationId: getReactionSummary
      tags: [Reactions]
      parameters: [{ $ref: '#/components/parameters/ContentId' }]
      responses: { '200': { description: Reaction summary, content: { application/json: { schema: { $ref: '#/components/schemas/ReactionSummary' } } } } }
  /api/v1/content/{contentId}/comments:
    get:
      operationId: listComments
      tags: [Comments]
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ContentId' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { '200': { description: Visible comment page, content: { application/json: { schema: { $ref: '#/components/schemas/CommentPage' } } } }, '400': { $ref: '#/components/responses/Problem' } }
    post:
      operationId: createComment
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ContentId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCommentRequest' } } } }
      responses: { '201': { description: Comment created, content: { application/json: { schema: { $ref: '#/components/schemas/CommentView' } } } } }
  /api/v1/content/{contentId}/comments/{commentId}:
    put:
      operationId: updateComment
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ContentId' }
        - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCommentRequest' } } } }
      responses: { '200': { description: Updated owner comment, content: { application/json: { schema: { $ref: '#/components/schemas/CommentView' } } } }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } }
    delete:
      operationId: deleteComment
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ContentId' }
        - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Deleted owner comment tombstone, content: { application/json: { schema: { $ref: '#/components/schemas/CommentView' } } } }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } }
  /api/v1/feed/{kind}:
    get:
      operationId: getFeed
      tags: [Feed]
