      responses: { '200': { description: Dashboard, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsDashboard' } } } } }
  /api/v1/administration/configuration/flags/{key}:
    put:
      operationId: setFeatureFlag
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetFeatureFlagRequest' } } } }
      responses: { '200': { description: Flag, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlagView' } } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    TargetId: { name: targetId, in: path, required: true, schema: { type: string, format: uuid } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    QuestionId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ContentId: { name: contentId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem: { description: Problem Details, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties: { username: { type: string }, email: { type: string, format: email }, password: { type: string, format: password, minLength: 12 } }
    RegisterResult:
      type: object
      required: [userId, username, email]
      properties: { userId: { type: string, format: uuid }, username: { type: string }, email: { type: string } }
    PublicDemoStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        visitorEmailDomain: { type: string, nullable: true }
        artifactRetentionHours: { type: integer, format: int32, nullable: true, minimum: 1, maximum: 168 }
    PublicDemoMailboxMessage:
      type: object
      required: [purpose, actionUrl, expiresAtUtc]
      properties:
        purpose: { type: string, enum: [EmailVerification, PasswordReset] }
        actionUrl: { type: string, format: uri }
        expiresAtUtc: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [login, password, deviceId, deviceName]
      properties: { login: { type: string }, password: { type: string, format: password }, deviceId: { type: string }, deviceName: { type: string }, mfaCode: { type: string, nullable: true } }
    EmailRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    SecurityTokenRequest:
      type: object
      required: [token]
      properties: { token: { type: string } }
    PasswordResetRequest:
      type: object
      required: [token, newPassword]
      properties: { token: { type: string }, newPassword: { type: string, format: password, minLength: 12 } }
    MfaCodeRequest:
      type: object
      required: [code]
      properties: { code: { type: string } }
    ConfirmMfaRequest:
      type: object
      required: [enrollmentToken, code]
      properties: { enrollmentToken: { type: string }, code: { type: string } }
    MfaEnrollment:
      type: object
      required: [secret, authenticatorUri, enrollmentToken]
      properties: { secret: { type: string }, authenticatorUri: { type: string }, enrollmentToken: { type: string } }
    MfaConfirmation:
      type: object
      required: [recoveryCodes]
      properties: { recoveryCodes: { type: array, items: { type: string } } }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties: { refreshToken: { type: string } }
    LoginResult:
      type: object
      required: [userId, username, tokens]
      properties: { userId: { type: string, format: uuid }, username: { type: string }, tokens: { $ref: '#/components/schemas/TokenPair' } }
    BrowserLoginResult:
      type: object
      required: [userId, username, accessToken, accessTokenExpiresAtUtc]
      properties: { userId: { type: string, format: uuid }, username: { type: string }, accessToken: { type: string }, accessTokenExpiresAtUtc: { type: string, format: date-time } }
    BrowserAccessToken:
      type: object
      required: [accessToken, accessTokenExpiresAtUtc]
      properties: { accessToken: { type: string }, accessTokenExpiresAtUtc: { type: string, format: date-time } }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, accessTokenExpiresAtUtc]
      properties: { accessToken: { type: string }, refreshToken: { type: string }, accessTokenExpiresAtUtc: { type: string, format: date-time } }
    SessionView:
      type: object
      required: [id, deviceId, deviceName, createdAtUtc, lastUsedAtUtc, expiresAtUtc, isRevoked]
      properties: { id: { type: string, format: uuid }, deviceId: { type: string }, deviceName: { type: string }, createdAtUtc: { type: string, format: date-time }, lastUsedAtUtc: { type: string, format: date-time }, expiresAtUtc: { type: string, format: date-time }, isRevoked: { type: boolean } }
    DeleteMyDataRequest:
      type: object
      required: [currentPassword]
      properties: { currentPassword: { type: string, format: password }, mfaCode: { type: string, nullable: true } }
    ExportedSession:
      type: object
      required: [id, deviceId, deviceName, createdAtUtc, lastUsedAtUtc, expiresAtUtc]
      properties: { id: { type: string, format: uuid }, deviceId: { type: string }, deviceName: { type: string }, createdAtUtc: { type: string, format: date-time }, lastUsedAtUtc: { type: string, format: date-time }, expiresAtUtc: { type: string, format: date-time }, revokedAtUtc: { type: string, format: date-time, nullable: true } }
    IdentityDataExport:
      type: object
      required: [userId, username, email, status, roles, mfaEnabled, createdAtUtc, updatedAtUtc, sessions, exportedAtUtc]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        status: { type: string }
        roles: { type: array, items: { type: string } }
        mfaEnabled: { type: boolean }
        createdAtUtc: { type: string, format: date-time }
        updatedAtUtc: { type: string, format: date-time }
        sessions: { type: array, items: { $ref: '#/components/schemas/ExportedSession' } }
        exportedAtUtc: { type: string, format: date-time }
    UpdateProfileRequest:
      type: object
      required: [handle, displayName, isPrivate, theme, language, reduceMotion]
      properties:
        handle: { type: string }
        displayName: { type: string }
        biography: { type: string, nullable: true }
        location: { type: string, nullable: true }
        organization: { type: string, nullable: true }
        websiteUrl: { type: string, format: uri, nullable: true }
        profileMediaId: { type: string, format: uuid, nullable: true }
        coverMediaId: { type: string, format: uuid, nullable: true }
        isPrivate: { type: boolean }
        theme: { type: string, enum: [System, Light, Dark] }
        language: { type: string, enum: [Turkish, English] }
        reduceMotion: { type: boolean }
    ProfileView:
      allOf:
        - $ref: '#/components/schemas/UpdateProfileRequest'
        - type: object
          required: [id, ownerId, completenessPercentage, version, isVerified]
          properties: { id: { type: string, format: uuid }, ownerId: { type: string, format: uuid }, completenessPercentage: { type: integer }, version: { type: integer, format: int64 }, isVerified: { type: boolean } }
    RelationshipView:
      type: object
      required: [actorId, targetId, followState, isBlocked, isBlockedByTarget, isMuted, isCloseFriend, version]
      properties:
        actorId: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        followState: { type: string, enum: [None, Pending, Following] }
        isBlocked: { type: boolean }
        isBlockedByTarget: { type: boolean }
        isMuted: { type: boolean }
        isCloseFriend: { type: boolean }
        version: { type: integer, format: int64 }
    SocialGraphSummaryView:
      type: object
      required: [ownerId, followerCount, followingCount, pendingRequestCount, canManageRequests]
      properties:
        ownerId: { type: string, format: uuid }
        followerCount: { type: integer, format: int64 }
        followingCount: { type: integer, format: int64 }
        pendingRequestCount: { type: integer, format: int64 }
        canManageRequests: { type: boolean }
    SocialGraphProfileView:
      type: object
      required: [ownerId, handle, displayName, isVerified]
      properties:
        ownerId: { type: string, format: uuid }
        handle: { type: string }
        displayName: { type: string }
        profileMediaId: { type: string, format: uuid, nullable: true }
        isVerified: { type: boolean }
    SocialGraphPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SocialGraphProfileView' } }
        nextCursor: { type: string, nullable: true }
    AskQuestionRequest:
      type: object
      required: [targetId, body, isAnonymous, audience, isDraft]
      properties:
        targetId: { type: string, format: uuid }
        body: { type: string, minLength: 4, maxLength: 1000 }
        isAnonymous: { type: boolean }
        audience: { type: string, enum: [Profile, Followers, Public] }
        isDraft: { type: boolean }
        publishAtUtc: { type: string, format: date-time, nullable: true }
    AnswerQuestionRequest:
      type: object
      required: [answer]
      properties: { answer: { type: string, minLength: 1, maxLength: 5000 } }
    QuestionView:
      type: object
      required: [id, targetId, body, isAnonymous, audience, status, createdAtUtc, version]
      properties:
        id: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        senderId: { type: string, format: uuid, nullable: true, description: Anonymous questions always return null. }
        sender: { $ref: '#/components/schemas/QuestionSenderSummary', nullable: true, description: Anonymous questions always return null. }
        body: { type: string }
        isAnonymous: { type: boolean }
